<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Extension Settings</title>
    <link rel="stylesheet" href="../styles/popup.css">
</head>
<body>
    <div class="main-header">
        <img src="../images/icon.png" alt="logo" class="logo">
        <h1>YouTube Shorts Enhancer</h1>
    </div>

    <div class="tab">
        <button class="tablinks" data-page="EventActionSettings" >Event Action Settings</button>
        <button class="tablinks" data-page="CustomActions">Custom Actions</button>
    </div>

    <!-- Tab content -->
    <div id="EventActionSettings" class="tabcontent">
        <div id="event_action_map">

        </div>
        <button id="reset">Reset Settings</button>
    </div>

    <div id="CustomActions" class="tabcontent">
        <div id="custom_event_action_map">
            <p class="fade_text">No custom actions added.</p>
        </div>

        <div class="add-custom-action">
            <h3>Add custom action</h3>
            <div class="event-action-pair">
                <input type="text" id="custom_action_key" placeholder="Action Trigger">
                <select id="custom_action_options">

                </select></div>

            <button id="add_custom_action">+</button>
            <p class="fade_text">NOTE: custom actions only work when the browser is in focus</p>
        </div>
    </div>

    <script src="../scripts/logger.js"></script>
    <script src="../scripts/config.js"></script>
    <script src="../scripts/string_map.js"></script>
    <script src="../scripts/popup.js"></script>
</body>
</html>
